services:
  - type: web
    name: drama-script-viewer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 300 --workers 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you enter this manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
