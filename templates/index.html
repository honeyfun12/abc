<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drama Script Viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Drama Script Viewer</h1>
      <p class="subtitle">드라마 제목 · 시즌 · 에피소드를 입력하면 전체 스크립트를 가져옵니다</p>
    </header>

    <section class="search-panel">
      <form id="searchForm" autocomplete="off">
        <div class="fields">
          <div class="field">
            <label for="show">드라마 제목</label>
            <input
              id="show"
              type="text"
              placeholder="예: Breaking Bad"
              required
            />
          </div>

          <div class="field field--narrow">
            <label for="season">시즌</label>
            <input
              id="season"
              type="number"
              min="1"
              value="1"
              placeholder="1"
              required
            />
          </div>

          <div class="field">
            <label for="episode">에피소드 (번호 또는 제목 키워드)</label>
            <input
              id="episode"
              type="text"
              placeholder="예: 1  또는  Pilot"
              required
            />
          </div>
        </div>

        <button type="submit" id="searchBtn">
          <span id="btnText">스크립트 가져오기</span>
          <span id="btnSpinner" class="spinner hidden"></span>
        </button>
      </form>
    </section>

    <section id="resultSection" class="result hidden">
      <div class="result-header">
        <div class="meta">
          <span id="metaShow" class="meta-show"></span>
          <span id="metaCode" class="meta-code"></span>
          <span id="metaTitle" class="meta-title"></span>
        </div>
        <div class="result-actions">
          <button id="copyBtn" title="클립보드에 복사">복사</button>
          <a id="sourceLink" href="#" target="_blank" rel="noopener" title="원본 페이지 열기">원본</a>
        </div>
      </div>
      <pre id="scriptText" class="script-body"></pre>
    </section>

    <section id="errorSection" class="error hidden">
      <p id="errorMsg"></p>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
